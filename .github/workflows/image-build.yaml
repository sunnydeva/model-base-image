# creae a docker image workflow
name: Build and Push Docker Image
on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: download docker in the ubuntu runner
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io 

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: sirumallasunnydeva@gmail.com
          password: Satyam@1969

      - name: execute the script to build the docker image
        run: |
          chmod +x ./scripts/build_and_push.sh
          ./scripts/build_and_push.sh